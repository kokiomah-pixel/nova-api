name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run doctrine lint
        run: python scripts/doctrine_lint.py

      - name: Run decision scenario suite
        run: python scripts/run_decision_scenario_suite.py

      - name: Run tests
        run: python -m pytest

      - name: Validate chronology reconciliation
        run: make chronology-verify PYTHON=python

      - name: Check whitespace
        run: git diff --check

      - name: Upload chronology cleanliness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronology-cleanliness-report
          path: reports/chronology/
          if-no-files-found: warn
