name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctrine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON: .venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check

      - name: Run doctrine lint
        run: make verify-doctrine

  cco_operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON: .venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check

      - name: Validate CCO operating spine and authority separation
        run: make verify-cco-operating-spine

      - name: Validate Jarvis-Nova command surface
        run: .venv/bin/python -m pytest tests/test_jarvis_nova_commands.py

  arc_market_signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON: .venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check

      - name: Validate Arc market-signal separation
        run: make verify-arc-market-signal-watch

  market_signal_scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON: .venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check

      - name: Validate governed-watch scan coverage
        run: make verify-market-signal-scan

  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: .venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check

      - name: Run decision scenario suite
        run: make verify-scenarios

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHON: .venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check

      - name: Run tests
        run: make verify-tests

  chronology:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHON: .venv/bin/python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve chronology evidence provenance
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reviewed_source_commit="${{ github.event.pull_request.head.sha }}"
          else
            reviewed_source_commit="${{ github.sha }}"
          fi

          ci_checkout_commit="$(git rev-parse HEAD)"

          echo "NOVA_REVIEWED_SOURCE_COMMIT=${reviewed_source_commit}" >> "${GITHUB_ENV}"
          echo "NOVA_CI_CHECKOUT_COMMIT=${ci_checkout_commit}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check

      - name: Validate chronology reconciliation
        run: make verify-chronology

      - name: Validate chronology artifact provenance
        shell: bash
        run: |
          set -euo pipefail

          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("reports/chronology/chronology-cleanliness.json")

          if not report_path.is_file():
              raise SystemExit(f"Missing chronology report: {report_path}")

          report = json.loads(report_path.read_text(encoding="utf-8"))

          expected = os.environ["NOVA_REVIEWED_SOURCE_COMMIT"]
          actual = report.get("source_commit")
          checkout = report.get("ci_checkout_commit")

          if actual != expected:
              raise SystemExit(
                  "Chronology artifact source commit mismatch: "
                  f"expected={expected} actual={actual}"
              )

          if not isinstance(checkout, str) or len(checkout) != 40:
              raise SystemExit(
                  "Chronology artifact checkout commit is missing or invalid"
              )

          print(
              "Chronology artifact provenance passed: "
              f"source_commit={actual} ci_checkout_commit={checkout}"
          )
          PY

      - name: Upload chronology cleanliness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronology-cleanliness-report
          path: reports/chronology/
          if-no-files-found: warn

  whitespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whitespace
        run: make verify-whitespace

  validation_summary:
    if: always()
    needs:
      - doctrine
      - cco_operations
      - arc_market_signal
      - market_signal_scan
      - scenarios
      - tests
      - chronology
      - whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Evaluate validation results
        shell: bash
        run: |
          set -euo pipefail

          doctrine="${{ needs.doctrine.result }}"
          cco_operations="${{ needs.cco_operations.result }}"
          arc_market_signal="${{ needs.arc_market_signal.result }}"
          market_signal_scan="${{ needs.market_signal_scan.result }}"
          scenarios="${{ needs.scenarios.result }}"
          tests="${{ needs.tests.result }}"
          chronology="${{ needs.chronology.result }}"
          whitespace="${{ needs.whitespace.result }}"

          echo "doctrine=${doctrine}"
          echo "cco_operations=${cco_operations}"
          echo "arc_market_signal=${arc_market_signal}"
          echo "market_signal_scan=${market_signal_scan}"
          echo "scenarios=${scenarios}"
          echo "tests=${tests}"
          echo "chronology=${chronology}"
          echo "whitespace=${whitespace}"

          if [ "${doctrine}" != "success" ] || \
             [ "${cco_operations}" != "success" ] || \
             [ "${arc_market_signal}" != "success" ] || \
             [ "${market_signal_scan}" != "success" ] || \
             [ "${scenarios}" != "success" ] || \
             [ "${tests}" != "success" ] || \
             [ "${chronology}" != "success" ] || \
             [ "${whitespace}" != "success" ]; then
            echo "One or more required validation controls failed."
            exit 1
          fi

          echo "All required validation controls passed."
