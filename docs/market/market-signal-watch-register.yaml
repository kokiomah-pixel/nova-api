category_boundary:
  statement: >
    x402 and edge infrastructure determine whether a payment requirement was
    satisfied and whether a resource may be served. Sharpe Nova OS structures
    the institution-defined review context surrounding why a machine
    expenditure was proposed and how the resulting resource should be treated
    if it later influences a consequential capital review.
  Nova_role: structures_context
  institutional_role: interprets
  external_wallet_and_payment_role: acts
  excluded_categories:
    - payment_gateway
    - x402_facilitator
    - wallet_policy_engine
