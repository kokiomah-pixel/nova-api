    - paid_data_marketplace
    - generic_retail_intelligence_API
    - marketplace_compliance_check
    - payment_authenticated_authority_service
    - marketplace_owned_institutional_data_layer

  access_class_statement: >
    Marketplace discovery may identify the capability. Retail usage, if
    separately authorized, remains non-institutional. Institutional Nova
    remains private, tenant-scoped decision-context infrastructure before
    local authority acts.
  Circle_dependency_created: false
  Circle_role: example_channel
  distribution_model: nonexclusive_required
  exclusive_distribution_authorized: false

