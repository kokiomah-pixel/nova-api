---
record_type: cco_operating_source_manifest
schema_version: cco_operating_source_manifest_v0_1
authority_effect: none
availability_states:
  - available
  - unavailable
  - not_checked
  - stale

mandatory_operational_sources:
  - repository_remote_main
  - material_open_prs
  - current_product_state
  - production_readiness
  - target_v2_contract
  - cco_priority_register

sources:
  - source_id: repository_remote_main
    source_type: dynamic_repository_source
    repository_path:
    authoritative_for:
      - merged_repository_state
      - canonical_file_presence_within_the_repository_being_checked
      - current_remote_head
    not_authoritative_for:
      - corporate_accepted_state_across_repository_authority_boundaries
      - local_working_tree
      - deployed_runtime
      - production_posture
      - live_control_plane

  - source_id: material_open_prs
    source_type: dynamic_repository_source
    repository_path:
    authoritative_for:
      - pending_change_visibility
      - PR_state
      - pending_diff_context
    not_authoritative_for:
      - corporate_accepted_state
      - implementation_authority
      - production_state

  - source_id: current_product_state
    source_type: governed_public_projection
    repository_path: CURRENT_STATE.md
    authority_owner: Architect
    authoritative_for:
      - compressed_public_current_state_projection
      - externally_supportable_product_direction
    not_authoritative_for:
      - canonical_corporate_accepted_state
      - deployed_runtime
      - live_control_plane

  - source_id: corporate_accepted_state_registry
    source_type: private_canonical_accepted_state_registry
    repository_path:
    external_repository: nova-infrastructure-systems/nova-core
    external_repository_path: governance/accepted-state/registry.yaml
    authority_owner: Architect
    public_repository_direct_access: not_assumed
    authoritative_for:
      - corporate_accepted_state_entries_within_recorded_scope
    not_authoritative_for:
      - claims_excluded_by_an_entry
      - deployed_runtime
      - production_state

  - source_id: public_historical_accepted_state_projection
    source_type: governed_historical_projection
    repository: nova-infrastructure-systems/sharpe-nova-os
    repository_path: agent_files/state/accepted-state-registry.yaml
    authoritative_for:
      - preserved_historical_public_accepted_state_payload
      - historical_public_provenance
    not_authoritative_for:
      - current_corporate_accepted_state
      - accepted_state_mutation
      - chronology_creation
      - Reflex_Memory_acceptance
      - implementation_authority
      - production_state

  - source_id: accepted_state_authority_transfer_activation
    source_type: governed_public_projection_control
    repository_path: docs/governance/canonical-authority-transfer-activation-2026-08-28.yaml
    authoritative_for:
      - public_projection_role_after_transfer
      - public_current_accepted_state_claim_prohibition
      - private_canonical_repository_identity_as_projected_publicly
    not_authoritative_for:
      - future_private_registry_entries_after_its_recorded_verification_window
      - deployed_runtime
      - production_state
      - capital_authority

  - source_id: governed_chronology_records
    source_type: governed_chronology
    repository_path: chronology
    authoritative_for:
      - schema_valid_governed_chronology_events_within_their_recorded_scope
    not_authoritative_for:
      - unrecorded_events
      - automatic_Reflex_Memory
      - authority_not_present_in_the_event_record
      - current_corporate_accepted_state_after_private_transfer

  - source_id: production_readiness
    source_type: governed_public_projection
    repository_path: docs/operations/production-readiness-register.md
    authoritative_for:
      - publicly_projected_gate_level_readiness_state
      - readiness_evidence_requirements
    not_authoritative_for:
      - canonical_corporate_accepted_state
      - current_live_production_state
      - system_wide_readiness_from_one_READY_subcomponent

  - source_id: cco_priority_register
    source_type: cco_operating_coordination_source
    repository_path: docs/operations/cco/current-priority-register.yaml
    authoritative_for:
      - current_CCO_operating_questions_within_the_public_projection_workstream
      - current_priority_sequence_within_recorded_scope
      - unresolved_CCO_items_within_recorded_scope
    not_authoritative_for:
      - corporate_accepted_state
      - product_implementation_authority
      - production_state
      - buyer_demand

  - source_id: target_v2_contract
    source_type: governed_public_contract
    repository_path: docs/target-v2/README.md
    authoritative_for:
      - public_target_v2_contract_projection
      - canonical_future_external_model_as_publicly_approved
      - target_v2_progression_sequence_as_publicly_approved
    not_authoritative_for:
      - canonical_corporate_accepted_state
      - target_v2_runtime_existence
      - target_v2_production_activity

  - source_id: governed_market_watches
    source_type: governed_repository_watch
    repository_path: docs/market/market-signal-watch-register.yaml
    authoritative_for:
      - governed_watch_presence
      - governed_watch_boundaries
      - watch_escalation_conditions
    not_authoritative_for:
      - buyer_demand
      - product_requirement
      - implementation_authority
      - production_authority

  - source_id: nova_api_repository_implementation
    source_type: historical_public_repository_implementation_source
    repository_path: app.py
    authoritative_for:
      - retained_public_repository_API_implementation_history
    not_authoritative_for:
      - current_private_production_implementation
      - deployed_commit
      - production_runtime
      - active_production_configuration
      - live_route_behavior
      - production_custody

  - source_id: live_production_evidence
    source_type: production_control_plane_attestation
    repository_path:
    authoritative_for:
      - bounded_attested_production_state
    not_authoritative_for:
      - state_outside_attestation_scope_or_window
    required_attestation_fields:
      - attestation_contract_reference
      - attestation_evidence_reference
      - environment_identifier
      - observed_at
      - observer_or_system
      - evidence_method
      - deployed_commit
      - control_plane_owner_or_custody

  - source_id: specialist_agent_outputs
    source_type: dynamic_specialist_output
    repository_path:
    authoritative_for:
      - claims_within_reviewed_usable_scope
    not_authoritative_for:
      - corporate_accepted_state
      - authority_not_separately_evidenced
    required_fields:
      - provenance
      - review_status
      - usable_claim_scope
      - excluded_claim_scope
      - freshness_or_expiration

source_state_rule:
  unavailable_is_false: false
  not_checked_is_no_change: false
  stale_is_current: false
